<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — AI YouTube Shorts Generator</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script>
        // Anti-FOUC: resolve the theme before first paint.
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.dataset.theme = t;
            } catch (e) {
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-text">
                <h1>Настройки</h1>
                <p>API-ключи и модели</p>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-secondary theme-toggle" type="button"
                        aria-label="Переключить тему" title="Переключить тему">
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4.2"></circle>
                        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"></path>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.2 14.2A8.2 8.2 0 0 1 9.8 3.8a8.2 8.2 0 1 0 10.4 10.4Z"></path>
                    </svg>
                </button>
                <button id="s2-save-settings-btn" class="btn-secondary" type="button">Сохранить</button>
            </div>
        </header>
        <nav class="page-nav" aria-label="Разделы">
            <a href="/">Генерация</a>
            <a href="/history">История</a>
            <a href="/settings" class="active" aria-current="page">Настройки</a>
        </nav>

        <main>
            <div class="form-card">
                <div class="form-section">
                    <h3>API-ключи и модели</h3>
                    <p class="form-hint settings-note">Применяются при генерации автоматически. Хранятся на сервере (settings.local.json)</p>

                    <div class="form-group">
                        <label for="s2_llm_provider">LLM-провайдер</label>
                        <select id="s2_llm_provider">
                            <option value="">MuAPI gpt-5-mini</option>
                            <option value="openai">OpenAI</option>
                            <option value="gemini">Gemini</option>
                            <option value="ollama">Ollama (local)</option>
                            <option value="nim">NVIDIA NIM</option>
                        </select>
                    </div>

                    <div class="api-group">
                        <label>MuAPI (режим API)</label>
                        <input type="password" id="s2_muapi_key" placeholder="Введите ключ MuAPI">
                    </div>

                    <div class="api-group">
                        <label>OpenAI</label>
                        <input type="password" id="s2_openai_key" placeholder="Введите ключ OpenAI">
                        <select id="s2_openai_model">
                            <option value="gpt-4o-mini">GPT-4o Mini (дёшево, быстро)</option>
                            <option value="gpt-4o">GPT-4o (баланс)</option>
                            <option value="gpt-4-turbo">GPT-4 Turbo</option>
                        </select>
                    </div>

                    <div class="api-group">
                        <label>Gemini</label>
                        <input type="password" id="s2_gemini_key" placeholder="Введите ключ Gemini">
                        <select id="s2_gemini_model">
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </select>
                    </div>

                    <div class="api-group">
                        <label>Ollama</label>
                        <input type="text" id="s2_ollama_url" placeholder="http://localhost:11434" value="http://localhost:11434">
                        <input type="text" id="s2_ollama_model" placeholder="Имя модели (напр. llama3.1:8b)" value="llama3.1:8b">
                    </div>

                    <div class="api-group">
                        <label>NVIDIA NIM</label>
                        <input type="password" id="s2_nim_key" placeholder="Введите ключ NIM (nvapi-...)">
                        <input type="text" id="s2_nim_url" placeholder="https://integrate.api.nvidia.com/v1" value="https://integrate.api.nvidia.com/v1">
                        <input
                            type="text"
                            id="s2_nim_model"
                            placeholder="Имя модели (напр. meta/llama-3.1-8b-instruct)"
                            value="meta/llama-3.1-8b-instruct"
                            list="s2-nim-model-suggestions"
                        >
                        <datalist id="s2-nim-model-suggestions">
                            <option value="meta/llama-3.1-8b-instruct">Llama 3.1 8B Instruct</option>
                            <option value="meta/llama-3.1-70b-instruct">Llama 3.1 70B Instruct</option>
                            <option value="meta/llama-3.1-405b-instruct">Llama 3.1 405B Instruct</option>
                            <option value="mistralai/mistral-7b-instruct-v0.3">Mistral 7B v0.3</option>
                            <option value="mistralai/mixtral-8x7b-instruct-v0.1">Mixtral 8x7B</option>
                            <option value="nvidia/nemotron-4-340b-instruct">Nemotron 340B</option>
                            <option value="google/gemma-2-9b-it">Gemma 2 9B</option>
                            <option value="microsoft/phi-3-medium-4k-instruct">Phi-3 Medium</option>
                        </datalist>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Транскрибация (локальный режим)</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="s2_whisper_device">Устройство транскрибации</label>
                            <select id="s2_whisper_device">
                                <option value="auto">Авто (GPU, если доступен)</option>
                                <option value="cuda">GPU (CUDA)</option>
                                <option value="cpu">CPU</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="s2_whisper_model">Модель Whisper</label>
                            <select id="s2_whisper_model">
                                <option value="tiny">Tiny (быстрее, менее точно)</option>
                                <option value="base" selected>Base (баланс)</option>
                                <option value="small">Small (медленнее, точнее)</option>
                                <option value="medium">Medium (медленно, очень точно)</option>
                                <option value="large">Large (медленнее всех, лучшее качество)</option>
                            </select>
                        </div>
                    </div>
                    <p class="form-hint">Применяются только в «Локальный» режиме на странице генерации.</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-root" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script src="{{ url_for('static', filename='settings.js') }}"></script>
</body>
</html>
